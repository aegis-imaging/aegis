<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS DICOM Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      height: 40px;
    }

    #header h1 {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      white-space: nowrap;
    }

    #status {
      font-size: 12px;
      color: #64748b;
      margin-left: auto;
      white-space: nowrap;
    }

    #status.loading { color: #0d9488; }
    #status.ready   { color: #0d9488; }
    #status.error   { color: #ea580c; }

    #toolbar {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 4px 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      height: 36px;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
      padding: 3px 10px;
      transition: background 0.15s, color 0.15s;
    }

    .tool-btn:hover {
      background: #273449;
      color: #e2e8f0;
    }

    .tool-btn.active {
      background: #0d9488;
      border-color: #0d9488;
      color: #ffffff;
    }

    .toolbar-sep {
      width: 1px;
      height: 20px;
      background: #334155;
      margin: 0 4px;
    }

    .slice-btn {
      background: transparent;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 8px;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }

    .slice-btn:hover:not(:disabled) {
      background: #273449;
      color: #e2e8f0;
    }

    .slice-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .slice-label {
      font-size: 12px;
      color: #64748b;
      min-width: 52px;
      text-align: center;
    }

    #hint {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 2px 16px;
      flex-shrink: 0;
    }

    #hint span {
      font-size: 11px;
      color: #475569;
    }

    #dwv-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* DWV styles */
    #dwv-container .layerContainer {
      width: 100%;
      height: 100%;
    }

    #error-message {
      padding: 24px;
      font-size: 14px;
      color: #ea580c;
      display: none;
    }

    /* Mobile-cap notice: shown when the instance list is truncated
       for performance on a narrow viewport. */
    #cap-banner {
      padding: 8px 16px;
      font-size: 12px;
      color: #92400e;
      background: #fef3c7;
      border-bottom: 1px solid #fcd34d;
      flex-shrink: 0;
      display: none;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>AEGIS DICOM Viewer</h1>
    <span id="status" class="loading">Initialising…</span>
  </div>
  <div id="toolbar">
    <button class="tool-btn" data-tool="Scroll" title="Scroll — mouse wheel to navigate slices">Scroll</button>
    <button class="tool-btn" data-tool="ZoomAndPan" title="Zoom/Pan — drag to pan, wheel to zoom">Zoom</button>
    <button class="tool-btn" data-tool="WindowLevel" title="Window/Level — drag to adjust brightness/contrast">W/L</button>
    <div class="toolbar-sep"></div>
    <button class="slice-btn" id="slice-prev" title="Previous slice">&#9664;</button>
    <span id="slice-label" class="slice-label">—</span>
    <button class="slice-btn" id="slice-next" title="Next slice">&#9654;</button>
  </div>
  <div id="hint"><span>Scroll: wheel · Zoom: drag / wheel · W/L: drag · Slices: ◀ ▶ buttons or wheel in Scroll mode</span></div>
  <div id="cap-banner"></div>
  <div id="dwv-container"></div>
  <p id="error-message"></p>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
