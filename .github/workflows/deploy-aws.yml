# ── AWS Deploy — auto-deploy on push to develop ────────────────────────────────
#
# Mirrors the GCP Cloud Build trigger (cloudbuild.yaml) for the AWS environment.
# Triggers on every push to develop, runs in parallel with the GCP Cloud Build.
#
# Required GitHub Secrets:
#   AWS_ACCOUNT_ID                  — 12-digit AWS account ID
#   AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN — optional explicit IAM role ARN for OIDC deploy auth
#                                      (if unset, workflow derives arn:aws:iam::<AWS_ACCOUNT_ID>:role/aegis-github-actions-deploy)
#
# Phase 1: Build all 15 service images in parallel (matrix) and push to ECR.
# Phase 2: Update all ECS services (force new deployment) + reboot DIMSE EC2.
#
# NOTE: landing uses the monorepo root as build context (its Dockerfile copies
# frontend/landing/server/ which requires the repo root to be the context).
# Landing deploy is conditional: workflow updates `aegis-landing` only when the
# ECS service exists (optional in terraform/aws via landing_image_tag).

name: Deploy to AWS

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate deploy guardrails
    runs-on: ubuntu-latest
    env:
      AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN: ${{ secrets.AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN != '' && secrets.AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN || format('arn:aws:iam::{0}:role/aegis-github-actions-deploy', secrets.AWS_ACCOUNT_ID) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate authentication guardrails
        run: ./scripts/check-auth-guardrails.sh

      - name: Validate required AWS deploy secrets
        run: |
          missing=()
          [[ -n "$AWS_ACCOUNT_ID" ]] || missing+=("AWS_ACCOUNT_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required GitHub Actions secrets for AWS deploy workflow:"
            printf '  - %s\n' "${missing[@]}"
            echo "Set these in: GitHub repo -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          if [[ -n "$AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN" ]]; then
            echo "Using explicit AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN secret."
          else
            echo "AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN is unset; deriving role ARN from AWS_ACCOUNT_ID."
          fi
          echo "Using OIDC role ARN: $AWS_DEPLOY_ROLE_ARN"

  # ── Phase 1: Build and push all images ──────────────────────────────────────

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN != '' && secrets.AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN || format('arn:aws:iam::{0}:role/aegis-github-actions-deploy', secrets.AWS_ACCOUNT_ID) }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: api
            dockerfile: api/Dockerfile
          - service: admin-dashboard
            context: .
            dockerfile: frontend/admin-dashboard/Dockerfile
            build_args: "--build-arg VITE_DWV_BASE_URL=https://aws.dwv.aegisimaging.ai"
          - service: dwv
            context: dwv
            dockerfile: dwv/Dockerfile
          - service: defacing
            context: defacing
            dockerfile: defacing/Dockerfile
          - service: phi-detection
            context: phi-detection
            dockerfile: phi-detection/Dockerfile
          - service: qc-service
            context: qc-service
            dockerfile: qc-service/Dockerfile
          - service: bids-service
            context: bids-service
            dockerfile: bids-service/Dockerfile
          - service: classification-service
            context: classification-service
            dockerfile: classification-service/Dockerfile
          - service: protocol-service
            context: protocol-service
            dockerfile: protocol-service/Dockerfile
          - service: synth-service
            context: synth-service
            dockerfile: synth-service/Dockerfile
          - service: analytics-service
            context: analytics-service
            dockerfile: analytics-service/Dockerfile
          - service: sct-service
            context: sct-service
            dockerfile: sct-service/Dockerfile
          - service: mcp-server
            context: mcp-server
            dockerfile: mcp-server/Dockerfile
          - service: dimse-receiver
            context: dimse-receiver
            dockerfile: dimse-receiver/Dockerfile
          - service: landing
            context: .
            dockerfile: frontend/landing/Dockerfile
            build_args: "--build-arg VITE_API_BASE_URL=https://aws.api.aegisimaging.ai"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_PREFIX:  ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/aegis
          IMAGE_TAG:   ${{ github.sha }}
          SERVICE:     ${{ matrix.service }}
          DOCKERFILE:  ${{ matrix.dockerfile }}
          CTX:         ${{ matrix.context }}
          BUILD_ARGS:  ${{ matrix.build_args }}
        run: |
          IMAGE="$ECR_PREFIX/$SERVICE"
          SHA_TAG="$IMAGE:$IMAGE_TAG"
          LATEST_TAG="$IMAGE:latest"

          docker build \
            --platform linux/amd64 \
            --file "$DOCKERFILE" \
            --tag  "$SHA_TAG" \
            --tag  "$LATEST_TAG" \
            ${BUILD_ARGS:+$BUILD_ARGS} \
            "$CTX"

          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"

  # ── Phase 2: Deploy ECS services + DIMSE EC2 ────────────────────────────────

  deploy-ecs:
    name: Deploy ECS services
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN != '' && secrets.AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN || format('arn:aws:iam::{0}:role/aegis-github-actions-deploy', secrets.AWS_ACCOUNT_ID) }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Force new deployment for all ECS services
        run: |
          CLUSTER="aegis-cluster"
          deploy_if_exists() {
            local service_name="$1"
            if aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$service_name" \
              --query 'services[0].status' \
              --output text \
              --no-cli-pager 2>/dev/null | grep -q ACTIVE; then
              echo "Updating $service_name..."
              aws ecs update-service \
                --cluster "$CLUSTER" \
                --service "$service_name" \
                --force-new-deployment \
                --no-cli-pager
            else
              echo "Skipping $service_name (service not provisioned)."
            fi
          }

          for SVC in \
            aegis-api \
            aegis-admin-dashboard \
            aegis-dwv \
            aegis-defacing \
            aegis-phi-detection \
            aegis-qc-service \
            aegis-bids-service \
            aegis-classification-service \
            aegis-protocol-service \
            aegis-synth-service \
            aegis-analytics-service \
            aegis-sct-service \
            aegis-mcp-server; do
            deploy_if_exists "$SVC"
          done

          deploy_if_exists "aegis-landing"

  deploy-dimse:
    name: Deploy DIMSE EC2
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN != '' && secrets.AWS_GITHUB_OIDC_DEPLOY_ROLE_ARN || format('arn:aws:iam::{0}:role/aegis-github-actions-deploy', secrets.AWS_ACCOUNT_ID) }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update DIMSE image SSM parameter
        env:
          ECR_PREFIX: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/aegis
          IMAGE_TAG:  ${{ github.sha }}
        run: |
          NEW_IMAGE="$ECR_PREFIX/dimse-receiver:$IMAGE_TAG"
          aws ssm put-parameter \
            --name  /aegis/dimse-image \
            --value "$NEW_IMAGE" \
            --type  String \
            --overwrite \
            --no-cli-pager
          echo "SSM /aegis/dimse-image -> $NEW_IMAGE"

      - name: Reboot DIMSE EC2 instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=aegis-dimse-receiver" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --no-cli-pager)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No running DIMSE instance found — skipping reboot (DIMSE not deployed yet)"
            exit 0
          fi

          echo "Rebooting DIMSE instance: $INSTANCE_ID"
          aws ec2 reboot-instances \
            --instance-ids "$INSTANCE_ID" \
            --no-cli-pager

  health-check:
    name: Post-deploy health check
    runs-on: ubuntu-latest
    needs: deploy-ecs
    env:
      AWS_API_URL: ${{ vars.AWS_API_URL }}
      AWS_ADMIN_URL: ${{ vars.AWS_ADMIN_URL }}
    steps:
      - name: Wait for rollout
        run: sleep 30

      - name: Verify API health
        run: |
          API_URL="${AWS_API_URL:-https://aws.api.aegisimaging.ai}"
          max_attempts=5
          delay=15
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Health check attempt $attempt/$max_attempts..."
            status=$(curl -s -o /tmp/healthz.json -w '%{http_code}' "$API_URL/healthz" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "API is healthy:"
              cat /tmp/healthz.json | python3 -m json.tool 2>/dev/null || cat /tmp/healthz.json
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::API health check failed after $max_attempts attempts (last HTTP $status)"
              cat /tmp/healthz.json 2>/dev/null || true
              exit 1
            fi
            echo "Got HTTP $status, retrying in ${delay}s..."
            sleep "$delay"
          done

      - name: Verify admin endpoint reachability
        run: |
          ADMIN_URL="${AWS_ADMIN_URL:-https://aws.admin.aegisimaging.ai}"
          status=$(curl -s -o /tmp/admin_headers.txt -w '%{http_code}' -I "$ADMIN_URL" 2>/dev/null || echo "000")
          case "$status" in
            200|301|302|401|403)
              echo "Admin endpoint reachable with HTTP $status"
              ;;
            *)
              echo "::error::Admin endpoint not reachable (HTTP $status)"
              cat /tmp/admin_headers.txt 2>/dev/null || true
              exit 1
              ;;
          esac

      - name: Write smoke summary
        run: |
          API_URL="${AWS_API_URL:-https://aws.api.aegisimaging.ai}"
          ADMIN_URL="${AWS_ADMIN_URL:-https://aws.admin.aegisimaging.ai}"
          API_STATUS=$(curl -s -o /tmp/healthz-summary.json -w '%{http_code}' "$API_URL/healthz" 2>/dev/null || echo "000")
          ADMIN_STATUS=$(curl -s -o /tmp/admin-summary-headers.txt -w '%{http_code}' -I "$ADMIN_URL" 2>/dev/null || echo "000")
          {
            echo "## Smoke Check Summary"
            echo ""
            echo "- Platform: AWS"
            echo "- API URL: ${API_URL}"
            echo "- API /healthz HTTP: ${API_STATUS}"
            echo "- Admin URL: ${ADMIN_URL}"
            echo "- Admin HEAD HTTP: ${ADMIN_STATUS}"
            echo "- Result: passed"
          } >> "$GITHUB_STEP_SUMMARY"
