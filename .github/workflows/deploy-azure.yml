name: Deploy to Azure

# Mirrors the GCP Cloud Build deploy trigger (cloudbuild.yaml).
# Fires on every push to `develop` and can also be triggered manually.
#
# Prerequisites (set in GitHub repo secrets / variables):
#   Secrets:
#     AZURE_CLIENT_ID          — Service principal / federated OIDC client ID
#     AZURE_TENANT_ID          — Azure AD tenant ID
#     AZURE_SUBSCRIPTION_ID    — Azure subscription ID
#     AZURE_ACR_REGISTRY       — ACR login server (e.g. aegisprodacr.azurecr.io)
#     AZURE_RESOURCE_GROUP     — Resource group name (e.g. aegis-prod)
#   Variables:
#     AZURE_WEASIS_URL          — Weasis container app URL (baked into admin-dashboard)
#     AZURE_API_URL             — API container app URL (baked into landing + admin-dashboard)
#     AZURE_DIMSE_VM_NAME       — DIMSE VM name (leave empty to skip DIMSE deploy)
#
# Auth uses OIDC federated identity — no long-lived credentials stored in GitHub.
# Setup: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write  # OIDC token exchange
  contents: read

jobs:
  # ── Phase 0: Pre-flight validation ─────────────────────────────────────────
  validate:
    name: Validate required configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate authentication guardrails
        run: ./scripts/check-auth-guardrails.sh

      - name: Check required variables and secrets
        env:
          WEASIS_URL:      ${{ vars.AZURE_WEASIS_URL }}
          API_URL:         ${{ vars.AZURE_API_URL }}
          ACR_REGISTRY:    ${{ secrets.AZURE_ACR_REGISTRY }}
          RESOURCE_GROUP:  ${{ secrets.AZURE_RESOURCE_GROUP }}
          CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          [[ -n "$WEASIS_URL" ]]      || missing+=("AZURE_WEASIS_URL (var)")
          [[ -n "$API_URL" ]]         || missing+=("AZURE_API_URL (var)")
          [[ -n "$ACR_REGISTRY" ]]    || missing+=("AZURE_ACR_REGISTRY (secret)")
          [[ -n "$RESOURCE_GROUP" ]]  || missing+=("AZURE_RESOURCE_GROUP (secret)")
          [[ -n "$CLIENT_ID" ]]       || missing+=("AZURE_CLIENT_ID (secret)")
          [[ -n "$TENANT_ID" ]]       || missing+=("AZURE_TENANT_ID (secret)")
          [[ -n "$SUBSCRIPTION_ID" ]] || missing+=("AZURE_SUBSCRIPTION_ID (secret)")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required GitHub variables/secrets:"
            printf '  - %s\n' "${missing[@]}"
            echo "Set these in: GitHub repo -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "All required variables and secrets are present."

  # ── Phase 1: Build all images in parallel (matrix strategy) ───────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: api
            dockerfile: api/Dockerfile
          - service: admin-dashboard
            context: frontend/admin-dashboard
            dockerfile: frontend/admin-dashboard/Dockerfile
            build_args: "--build-arg VITE_WEASIS_BASE_URL=$WEASIS_URL --build-arg VITE_API_BASE_URL=$API_URL"
          - service: landing
            context: .
            dockerfile: frontend/landing/Dockerfile
            build_args: "--build-arg VITE_API_BASE_URL=$API_URL"
          - service: weasis
            context: weasis
            dockerfile: weasis/Dockerfile
          - service: defacing
            context: defacing
            dockerfile: defacing/Dockerfile
          - service: phi-detection
            context: phi-detection
            dockerfile: phi-detection/Dockerfile
          - service: qc-service
            context: qc-service
            dockerfile: qc-service/Dockerfile
          - service: bids-service
            context: bids-service
            dockerfile: bids-service/Dockerfile
          - service: classification-service
            context: classification-service
            dockerfile: classification-service/Dockerfile
          - service: protocol-service
            context: protocol-service
            dockerfile: protocol-service/Dockerfile
          - service: synth-service
            context: synth-service
            dockerfile: synth-service/Dockerfile
          - service: analytics-service
            context: analytics-service
            dockerfile: analytics-service/Dockerfile
          - service: sct-service
            context: sct-service
            dockerfile: sct-service/Dockerfile
          - service: mcp-server
            context: mcp-server
            dockerfile: mcp-server/Dockerfile
          - service: dimse-receiver
            context: dimse-receiver
            dockerfile: dimse-receiver/Dockerfile

    env:
      IMAGE_TAG: ${{ github.sha }}
      ACR: ${{ secrets.AZURE_ACR_REGISTRY }}
      WEASIS_URL: ${{ vars.AZURE_WEASIS_URL }}
      API_URL: ${{ vars.AZURE_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR"

      - name: Build and push
        env:
          SERVICE:    ${{ matrix.service }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CTX:        ${{ matrix.context }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          SHA_TAG="$ACR/$SERVICE:$IMAGE_TAG"
          LATEST_TAG="$ACR/$SERVICE:latest"

          # Expand build args (they reference env vars like $WEASIS_URL)
          EXPANDED_ARGS=""
          if [[ -n "${BUILD_ARGS:-}" ]]; then
            EXPANDED_ARGS=$(eval echo "$BUILD_ARGS")
          fi

          docker build \
            --platform linux/amd64 \
            --file "$DOCKERFILE" \
            --tag  "$SHA_TAG" \
            --tag  "$LATEST_TAG" \
            ${EXPANDED_ARGS:+$EXPANDED_ARGS} \
            "$CTX"

          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"

  # ── Phase 2: Deploy all Container Apps ────────────────────────────────────
  deploy:
    name: Deploy Container Apps
    runs-on: ubuntu-latest
    needs: build
    env:
      IMAGE_TAG: ${{ github.sha }}
      ACR: ${{ secrets.AZURE_ACR_REGISTRY }}
      RG: ${{ secrets.AZURE_RESOURCE_GROUP }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy — api
        run: az containerapp update --name aegis-prod-api --resource-group "$RG" --image "$ACR/api:$IMAGE_TAG"

      - name: Deploy — admin-dashboard
        run: az containerapp update --name aegis-prod-admin-dashboard --resource-group "$RG" --image "$ACR/admin-dashboard:$IMAGE_TAG"

      - name: Deploy — landing
        run: az containerapp update --name aegis-prod-landing --resource-group "$RG" --image "$ACR/landing:$IMAGE_TAG"

      - name: Deploy — weasis
        run: az containerapp update --name aegis-prod-weasis --resource-group "$RG" --image "$ACR/weasis:$IMAGE_TAG"

      - name: Deploy — defacing
        run: az containerapp update --name aegis-prod-defacing --resource-group "$RG" --image "$ACR/defacing:$IMAGE_TAG"

      - name: Deploy — phi-detection
        run: az containerapp update --name aegis-prod-phi-detection --resource-group "$RG" --image "$ACR/phi-detection:$IMAGE_TAG"

      - name: Deploy — qc-service
        run: az containerapp update --name aegis-prod-qc-service --resource-group "$RG" --image "$ACR/qc-service:$IMAGE_TAG"

      - name: Deploy — bids-service
        run: az containerapp update --name aegis-prod-bids-service --resource-group "$RG" --image "$ACR/bids-service:$IMAGE_TAG"

      - name: Deploy — classification-service
        run: az containerapp update --name aegis-prod-classify --resource-group "$RG" --image "$ACR/classification-service:$IMAGE_TAG"

      - name: Deploy — protocol-service
        run: az containerapp update --name aegis-prod-protocol-service --resource-group "$RG" --image "$ACR/protocol-service:$IMAGE_TAG"

      - name: Deploy — synth-service
        run: az containerapp update --name aegis-prod-synth-service --resource-group "$RG" --image "$ACR/synth-service:$IMAGE_TAG"

      - name: Deploy — analytics-service
        run: az containerapp update --name aegis-prod-analytics-service --resource-group "$RG" --image "$ACR/analytics-service:$IMAGE_TAG"

      - name: Deploy — sct-service
        run: az containerapp update --name aegis-prod-sct-service --resource-group "$RG" --image "$ACR/sct-service:$IMAGE_TAG"

      - name: Deploy — mcp-server
        run: az containerapp update --name aegis-prod-mcp-server --resource-group "$RG" --image "$ACR/mcp-server:$IMAGE_TAG"

  # ── Phase 2b: Post-deploy health check ───────────────────────────────────
  health-check:
    name: Post-deploy health check
    runs-on: ubuntu-latest
    needs: deploy
    env:
      API_URL: ${{ vars.AZURE_API_URL }}
      AZURE_ADMIN_URL: ${{ vars.AZURE_ADMIN_URL }}
    steps:
      - name: Wait for rollout
        run: sleep 30

      - name: Verify API health
        run: |
          max_attempts=5
          delay=15
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Health check attempt $attempt/$max_attempts..."
            status=$(curl -s -o /tmp/healthz.json -w '%{http_code}' "$API_URL/healthz" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "API is healthy:"
              cat /tmp/healthz.json | python3 -m json.tool 2>/dev/null || cat /tmp/healthz.json
              exit 0
            fi
            echo "Got HTTP $status, retrying in ${delay}s..."
            sleep "$delay"
          done
          echo "::error::API health check failed after $max_attempts attempts (last HTTP $status)"
          cat /tmp/healthz.json 2>/dev/null || true
          exit 1

      - name: Verify admin endpoint reachability
        run: |
          ADMIN_URL="${AZURE_ADMIN_URL:-https://azure.admin.aegisimaging.ai}"
          status=$(curl -s -o /tmp/admin_headers.txt -w '%{http_code}' -I "$ADMIN_URL" 2>/dev/null || echo "000")
          case "$status" in
            200|301|302|401|403)
              echo "Admin endpoint reachable with HTTP $status"
              ;;
            *)
              echo "::error::Admin endpoint not reachable (HTTP $status)"
              cat /tmp/admin_headers.txt 2>/dev/null || true
              exit 1
              ;;
          esac

      - name: Write smoke summary
        run: |
          API_URL_VALUE="${API_URL}"
          ADMIN_URL_VALUE="${AZURE_ADMIN_URL:-https://azure.admin.aegisimaging.ai}"
          API_STATUS=$(curl -s -o /tmp/healthz-summary.json -w '%{http_code}' "$API_URL_VALUE/healthz" 2>/dev/null || echo "000")
          ADMIN_STATUS=$(curl -s -o /tmp/admin-summary-headers.txt -w '%{http_code}' -I "$ADMIN_URL_VALUE" 2>/dev/null || echo "000")
          {
            echo "## Smoke Check Summary"
            echo ""
            echo "- Platform: Azure"
            echo "- API URL: ${API_URL_VALUE}"
            echo "- API /healthz HTTP: ${API_STATUS}"
            echo "- Admin URL: ${ADMIN_URL_VALUE}"
            echo "- Admin HEAD HTTP: ${ADMIN_STATUS}"
            echo "- Result: passed"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Phase 3: Deploy DIMSE Receiver VM (if configured) ─────────────────────
  # Only runs when AZURE_DIMSE_VM_NAME variable is set.
  deploy-dimse:
    name: Deploy DIMSE Receiver VM
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.AZURE_DIMSE_VM_NAME != '' }}
    env:
      IMAGE_TAG: ${{ github.sha }}
      ACR: ${{ secrets.AZURE_ACR_REGISTRY }}
      RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
      DIMSE_VM: ${{ vars.AZURE_DIMSE_VM_NAME }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update DIMSE VM — pull new image and restart container
        run: |
          az vm run-command invoke \
            --resource-group "$RG" \
            --name "$DIMSE_VM" \
            --command-id RunShellScript \
            --scripts "
              set -euo pipefail
              ACR_TOKEN=\$(az acr login --name \"$ACR\" --expose-token --output tsv --query accessToken 2>/dev/null)
              docker login \"$ACR\" --username 00000000-0000-0000-0000-000000000000 --password \"\$ACR_TOKEN\"
              docker pull \"$ACR/dimse-receiver:$IMAGE_TAG\"
              # Capture env vars from the running container BEFORE removing it.
              PREV_ENV=\$(docker inspect --format '{{range .Config.Env}}-e {{.}} {{end}}' dimse-receiver 2>/dev/null || echo '')
              docker rm -f dimse-receiver 2>/dev/null || true
              docker run -d \
                --name dimse-receiver \
                --restart unless-stopped \
                -p 11112:11112 \
                \$PREV_ENV \
                \"$ACR/dimse-receiver:$IMAGE_TAG\"
            "
