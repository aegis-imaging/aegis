name: build-dimse-bridge

# Phase 3A scope: Linux .deb + macOS .pkg. Windows job is commented out
# below; it lands in Phase 3B once the EV cert + AzureSignTool flow from
# Phase 2 is proven in production.

on:
  push:
    tags:
      - 'dimse-bridge-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 1.0.0)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: read
  id-token: write     # for OIDC auth to GCS staging bucket on tag pushes

env:
  PYTHON_VERSION: '3.11'

jobs:

  build-linux:
    name: Linux .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: dimse-bridge-installer/requirements.txt

      - name: Install build deps
        working-directory: dimse-bridge-installer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller bundle
        working-directory: dimse-bridge-installer
        run: pyinstaller src/pyinstaller/bridge.spec

      - name: Determine version
        id: version
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${REF}" == refs/tags/dimse-bridge-v* ]]; then
            VERSION="${REF#refs/tags/dimse-bridge-v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0-dev}"
          fi
          # Sanitize: only allow [A-Za-z0-9.+-_].
          VERSION="$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9.+_-')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        working-directory: dimse-bridge-installer
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: bash packaging/linux/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-dimse-bridge-linux-${{ steps.version.outputs.version }}
          path: dimse-bridge-installer/dist/*.deb
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS .pkg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: dimse-bridge-installer/requirements.txt

      - name: Install build deps
        working-directory: dimse-bridge-installer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller bundle
        working-directory: dimse-bridge-installer
        run: pyinstaller src/pyinstaller/bridge.spec

      - name: Determine version
        id: version
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${REF}" == refs/tags/dimse-bridge-v* ]]; then
            VERSION="${REF#refs/tags/dimse-bridge-v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0-dev}"
          fi
          VERSION="$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9.+_-')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Apple signing secrets are intentionally optional — when absent the
      # build-pkg.sh skips codesign/productsign/notarytool and emits an
      # unsigned .pkg. This keeps PR builds and forks green.
      - name: Import Apple signing certs
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        if: env.APPLE_CERT_P12_BASE64 != ''
        run: |
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > /tmp/cert.p12
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          rm /tmp/cert.p12

      - name: Build .pkg
        working-directory: dimse-bridge-installer
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE }}
        run: bash packaging/macos/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-dimse-bridge-macos-${{ steps.version.outputs.version }}
          path: dimse-bridge-installer/dist/*.pkg
          if-no-files-found: error
          retention-days: 30

  # --- Phase 3B (Windows) ------------------------------------------------
  # Uncomment once the EV code-signing cert is provisioned in Azure Key
  # Vault and AzureSignTool / WiX 4 toolchain is validated.
  #
  # build-windows:
  #   name: Windows .msi
  #   runs-on: windows-2022
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with: { python-version: '3.11' }
  #     - name: Install build deps
  #       working-directory: dimse-bridge-installer
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install -r requirements.txt pywin32
  #     - name: PyInstaller bundle
  #       working-directory: dimse-bridge-installer
  #       run: pyinstaller src/pyinstaller/bridge.spec
  #     - name: Install WiX 4
  #       run: dotnet tool install --global wix
  #     - name: Build .msi
  #       working-directory: dimse-bridge-installer/packaging/windows
  #       run: wix build installer.wxs -d Version=${{ github.run_number }} -o dist/aegis-dimse-bridge.msi
  #     - uses: actions/upload-artifact@v4
  #       with: { name: aegis-dimse-bridge-windows, path: dimse-bridge-installer/packaging/windows/dist/*.msi }

  publish:
    name: Publish to staging bucket
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/dimse-bridge-v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_INSTALLER_PUBLISHER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload to aegis-prod-installer-staging
        env:
          REF: ${{ github.ref }}
        run: |
          VERSION="${REF#refs/tags/dimse-bridge-v}"
          VERSION="$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9.+_-')"
          find artifacts -type f \( -name '*.deb' -o -name '*.pkg' -o -name '*.msi' \) -print0 |
            while IFS= read -r -d '' f; do
              gsutil cp "$f" "gs://aegis-prod-installer-staging/dimse-bridge/${VERSION}/"
            done
