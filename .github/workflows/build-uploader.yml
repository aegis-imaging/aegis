name: build-uploader

# Phase 2A: macOS-only matrix. The Phase 2B block at the bottom of `matrix.include`
# is commented out — uncomment it once Windows + Linux signing keys are in place.
#
# Triggers:
#   - Push of a `uploader-v*` tag (e.g. `uploader-v0.1.0`)
#   - Manual `workflow_dispatch` for ad-hoc test builds
#
# Skeleton secrets (all OPTIONAL — missing values just produce an unsigned bundle):
#   APPLE_CERTIFICATE                  base64-encoded .p12
#   APPLE_CERTIFICATE_PASSWORD         password for the .p12
#   APPLE_SIGNING_IDENTITY             "Developer ID Application: ..."
#   APPLE_ID                           Apple ID email used for notarisation
#   APPLE_PASSWORD                     app-specific password
#   APPLE_TEAM_ID                      10-char team ID
#   TAURI_SIGNING_PRIVATE_KEY          ed25519 private key file contents
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD password the key was generated with
#
# Security note: this workflow only references `github.ref_type`, `github.ref_name`,
# `github.sha`, and `secrets.*` — all controlled by repo owners or git refs, never
# by untrusted PR / issue input. No `github.event.*` user content reaches a `run:`.

on:
  push:
    tags:
      - 'uploader-v*'
  workflow_dispatch: {}

permissions:
  contents: write  # tauri-action needs this to upload release artifacts

jobs:
  build:
    name: build (${{ matrix.platform }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            arch: arm64
            rust_target: aarch64-apple-darwin
          - platform: macos-13
            arch: x64
            rust_target: x86_64-apple-darwin

          # ----- Phase 2B (uncomment when Win+Linux are ready) -----
          # - platform: windows-latest
          #   arch: x64
          #   rust_target: x86_64-pc-windows-msvc
          # - platform: ubuntu-22.04
          #   arch: x64
          #   rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop-uploader/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-uploader/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('desktop-uploader/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      # Linux deps (uncommented when the Phase 2B linux entry is enabled).
      # - name: Install Linux build dependencies
      #   if: matrix.platform == 'ubuntu-22.04'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev

      - name: Install JS dependencies (root client + uploader)
        working-directory: desktop-uploader
        run: pnpm install --no-frozen-lockfile

      # Gate Apple + Tauri-updater signing on whether the relevant secrets are
      # populated. Missing secrets fall back to an unsigned dev build.
      - name: Determine signing mode
        id: signing
        shell: bash
        env:
          APPLE_CERT_PRESENT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          TAURI_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$APPLE_CERT_PRESENT" = "true" ]; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$TAURI_KEY_PRESENT" = "true" ]; then
            echo "tauri=true" >> "$GITHUB_OUTPUT"
          else
            echo "tauri=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (signed)
        if: steps.signing.outputs.apple == 'true' && steps.signing.outputs.tauri == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-uploader
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('uploader-v0.0.0-{0}', github.sha) }}
          releaseName: 'AEGIS Uploader ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }}

      - name: Build (unsigned)
        if: steps.signing.outputs.apple != 'true' || steps.signing.outputs.tauri != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop-uploader
          # Skip releaseDraft entirely when unsigned — the artifacts can only
          # be used for internal smoke tests and shouldn't go on the release.
          tagName: ''
          args: --target ${{ matrix.rust_target }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-uploader-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop-uploader/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.dmg
            desktop-uploader/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.app
            desktop-uploader/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.msi
            desktop-uploader/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.exe
            desktop-uploader/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.deb
            desktop-uploader/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.AppImage
          if-no-files-found: warn
          retention-days: 14
