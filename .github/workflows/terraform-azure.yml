name: Terraform Azure

# Mirrors the GCP Cloud Build terraform-apply-on-develop trigger
# (cloudbuild.terraform.yaml). Fires only when terraform/azure/** files change.
#
# Prerequisites (set in GitHub repo secrets):
#   AZURE_CLIENT_ID          — Service principal / federated OIDC client ID
#   AZURE_TENANT_ID          — Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID    — Azure subscription ID
#   AZURE_TERRAFORM_TFVARS   — Full contents of terraform/azure/terraform.tfvars
#
# Auth uses OIDC federated identity — no long-lived credentials stored in GitHub.
# The service principal must have Contributor on the subscription and
# Storage Blob Data Contributor on the aegis-tfstate storage account.

on:
  push:
    branches:
      - develop
    paths:
      - "terraform/azure/**"
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC token exchange
  contents: read

jobs:
  terraform:
    name: Terraform Apply (Azure)
    runs-on: ubuntu-latest
    env:
      # Terraform azurerm provider authenticates via OIDC using these env vars.
      # No ARM_CLIENT_SECRET needed — OIDC federated identity only.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Write terraform.tfvars
        env:
          TFVARS_CONTENT: ${{ secrets.AZURE_TERRAFORM_TFVARS }}
        working-directory: terraform/azure
        run: printf '%s\n' "$TFVARS_CONTENT" > terraform.tfvars

      - name: Terraform Init
        working-directory: terraform/azure
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform/azure
        run: terraform validate

      - name: Import orphaned DIMSE resources
        working-directory: terraform/azure
        # These resources were created by a partial apply run that failed before
        # writing state. Import them so the next plan sees them and skips creation.
        # Each line uses || true so the step passes when resources are already in state.
        run: |
          SUB=/subscriptions/c1140c6f-a27f-4a02-a87d-8e8fc1e8f75f
          RG=/resourceGroups/aegis-prod

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_subnet.dimse[0]' \
            "${SUB}${RG}/providers/Microsoft.Network/virtualNetworks/aegis-prod-vnet/subnets/dimse" || true

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_public_ip.dimse[0]' \
            "${SUB}${RG}/providers/Microsoft.Network/publicIPAddresses/aegis-prod-dimse-ip" || true

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_network_security_group.dimse[0]' \
            "${SUB}${RG}/providers/Microsoft.Network/networkSecurityGroups/aegis-prod-dimse-nsg" || true

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_network_interface.dimse[0]' \
            "${SUB}${RG}/providers/Microsoft.Network/networkInterfaces/aegis-prod-dimse-nic" || true

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_network_interface_security_group_association.dimse[0]' \
            "${SUB}${RG}/providers/Microsoft.Network/networkInterfaces/aegis-prod-dimse-nic|${SUB}${RG}/providers/Microsoft.Network/networkSecurityGroups/aegis-prod-dimse-nsg" || true

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_managed_disk.dimse_data[0]' \
            "${SUB}${RG}/providers/Microsoft.Compute/disks/aegis-prod-dimse-data" || true

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_user_assigned_identity.dimse[0]' \
            "${SUB}/resourcegroups/aegis-prod/providers/Microsoft.ManagedIdentity/userAssignedIdentities/aegis-prod-dimse" || true

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_role_assignment.dimse_acr_pull[0]' \
            "${SUB}${RG}/providers/Microsoft.ContainerRegistry/registries/aegisprodacr/providers/Microsoft.Authorization/roleAssignments/fc71d619-33db-a195-ae65-92a3fc680021" || true

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_role_assignment.dimse_blob[0]' \
            "${SUB}${RG}/providers/Microsoft.Storage/storageAccounts/aegisproddicom/providers/Microsoft.Authorization/roleAssignments/9299be11-d5b4-a630-c5f9-4833096d8dd8" || true

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_linux_virtual_machine.dimse[0]' \
            "${SUB}${RG}/providers/Microsoft.Compute/virtualMachines/aegis-prod-dimse-receiver" || true

          terraform import -var 'api_image_tag=placeholder' \
            'azurerm_virtual_machine_data_disk_attachment.dimse[0]' \
            "${SUB}${RG}/providers/Microsoft.Compute/virtualMachines/aegis-prod-dimse-receiver/dataDisks/aegis-prod-dimse-data" || true

      - name: Terraform Plan
        id: plan
        working-directory: terraform/azure
        # Use api_image_tag=placeholder so Container Apps can be created even when
        # ACR images have not been pushed yet. GitHub Actions (deploy-azure.yml)
        # updates the images via `az containerapp update` after pushing to ACR.
        # The lifecycle { ignore_changes = [template[0].container[0].image] } block
        # on each Container App prevents terraform from reverting CI/CD-deployed images.
        run: terraform plan -input=false -no-color -var 'api_image_tag=placeholder' -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/azure
        run: terraform apply -input=false -no-color tfplan
