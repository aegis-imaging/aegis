name: Security Cadence

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC

permissions:
  contents: read

jobs:
  security-cadence:
    name: Weekly security baseline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run guardrail scripts
        run: |
          chmod +x scripts/check-*.sh
          ./scripts/check-auth-guardrails.sh
          ./scripts/check-edge-security-parity.sh
          ./scripts/check-monitoring-alert-parity.sh
          ./scripts/check-hipaa-day1-controls.sh
          ./scripts/check-terraform-security-baseline.sh
      - name: Go dependency snapshot
        working-directory: api
        run: go list -m all > ../docs/monitoring/go-modules-snapshot.txt
      - name: Node dependency snapshots
        run: |
          npm --prefix mcp-server ls --all > docs/monitoring/mcp-npm-deps.txt || true
          npm --prefix frontend/admin-dashboard ls --all > docs/monitoring/admin-dashboard-npm-deps.txt || true
      - name: Python dependency snapshots
        run: |
          python -m pip install -r defacing/requirements.txt >/dev/null
          python -m pip freeze > docs/monitoring/python-freeze-snapshot.txt
      - name: Upload security cadence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-cadence-artifacts
          path: |
            docs/monitoring/go-modules-snapshot.txt
            docs/monitoring/mcp-npm-deps.txt
            docs/monitoring/admin-dashboard-npm-deps.txt
            docs/monitoring/python-freeze-snapshot.txt
