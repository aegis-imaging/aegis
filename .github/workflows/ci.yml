name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  infra-guard:
    name: Infra placeholder guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Terraform credential placeholders
        run: ./scripts/check-infra-placeholders.sh

  go:
    name: Go build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        working-directory: api
        run: go build ./...
      - name: Vet
        working-directory: api
        run: go vet ./...

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run tests
        working-directory: api
        run: go test -race -v -count=1 ./...

  python:
    name: "Python check (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [defacing, phi-detection, qc-service, bids-service, classification-service, protocol-service, dimse-receiver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: find ${{ matrix.service }} -name '*.py' -exec python -m py_compile {} +

  python-scripts:
    name: Python script check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check (harness scripts)
        run: python -m py_compile scripts/cloud_smoke_test.py scripts/dimse_pacs_e2e_harness.py

  python-test:
    name: "Python tests (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [defacing, phi-detection, qc-service, bids-service, classification-service, protocol-service, dimse-receiver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: cd ${{ matrix.service }} && pip install -r requirements.txt -r requirements-test.txt
      - name: Run tests
        run: cd ${{ matrix.service }} && pytest -v --tb=short

  frontend:
    name: "TypeScript check (${{ matrix.app.name }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - { dir: client, name: "@aegis/client", needs_client: false }
          - { dir: frontend/upload-portal, name: upload-portal, needs_client: true }
          - { dir: frontend/admin-dashboard, name: admin-dashboard, needs_client: false }
          - { dir: frontend/landing, name: landing, needs_client: false }
          - { dir: frontend/export-portal, name: export-portal, needs_client: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build @aegis/client (dependency)
        if: matrix.app.needs_client
        run: cd client && npm install && npm run build
      - name: Install dependencies
        run: cd ${{ matrix.app.dir }} && npm install
      - name: Type check
        run: cd ${{ matrix.app.dir }} && npx tsc --noEmit

  docker:
    name: "Docker build (${{ matrix.service.name }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { context: api, name: api }
          - { context: defacing, name: defacing }
          - { context: phi-detection, name: phi-detection }
          - { context: qc-service, name: qc-service }
          - { context: bids-service, name: bids-service }
          - { context: classification-service, name: classification-service }
          - { context: protocol-service, name: protocol-service }
          - { context: dimse-receiver, name: dimse-receiver }
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (retry on transient registry errors)
        shell: bash
        run: |
          set -euo pipefail
          image="aegis-${{ matrix.service.name }}:ci"
          context="${{ matrix.service.context }}"
          attempts=5
          delay_seconds=10

          for attempt in $(seq 1 "${attempts}"); do
            echo "Docker build attempt ${attempt}/${attempts}: ${image} from ${context}"
            if docker build -t "${image}" "${context}"; then
              exit 0
            fi

            if [ "${attempt}" -eq "${attempts}" ]; then
              break
            fi

            echo "Build failed; sleeping ${delay_seconds}s before retry..."
            sleep "${delay_seconds}"
            delay_seconds=$((delay_seconds * 2))
          done

          echo "Docker build failed after ${attempts} attempts."
          exit 1
