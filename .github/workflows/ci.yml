name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  infra-guard:
    name: Infra placeholder guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Terraform credential placeholders
        run: ./scripts/check-infra-placeholders.sh

  access-matrix-guard:
    name: Access matrix guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate authenticated route coverage in access matrix
        run: ./scripts/check-access-matrix-coverage.sh

  migration-version-guard:
    name: Migration version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on duplicate goose migration version numbers
        run: ./scripts/check-migration-versions.sh

  terraform:
    name: "Terraform checks (${{ matrix.module }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [project, infra, aws, azure]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt check
        run: terraform -chdir=terraform/${{ matrix.module }} fmt -check
      - name: Terraform init
        run: terraform -chdir=terraform/${{ matrix.module }} init -backend=false
      - name: Terraform validate
        env:
          TF_VAR_acm_certificate_arn: "arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000000"
          TF_VAR_cognito_domain_prefix: "aegis-ci"
          TF_VAR_azure_ad_tenant_id: "00000000-0000-0000-0000-000000000000"
          TF_VAR_db_admin_password: "ci-placeholder"
        run: terraform -chdir=terraform/${{ matrix.module }} validate

  go:
    name: Go build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        working-directory: api
        run: go build ./...
      - name: Vet
        working-directory: api
        run: go vet ./...

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run tests
        working-directory: api
        run: go test -race -v -count=1 ./...

  python:
    name: "Python check (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [defacing, dicom-tools, dimse-receiver, midi-b, analytics-service, sct-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: find ${{ matrix.service }} -name '*.py' -exec python -m py_compile {} +

  python-scripts:
    name: Python script check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check (harness scripts)
        run: python -m py_compile scripts/cloud_smoke_test.py scripts/dimse_pacs_e2e_harness.py scripts/tcia_download.py

  shell-scripts:
    name: "Shell script syntax (${{ matrix.script }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script:
          - scripts/check-infra-placeholders.sh
          - scripts/gcp_preflight.sh
          - scripts/gcp_bootstrap_project.sh
          - scripts/gcp_build_push_images.sh
          - scripts/gcp_apply_infra.sh
          - scripts/gcp_install_poc.sh
          - scripts/check-auth-guardrails.sh
          - scripts/check-hipaa-day1-controls.sh
          - scripts/check-runbook-readiness.sh
          - scripts/check-terraform-security-baseline.sh
          - scripts/check-migration-versions.sh
          - scripts/gcp_setup_cloudbuild.sh
          - scripts/onprem_install.sh
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n ${{ matrix.script }}

  # Multi-cloud parity / conformance checks have been retired with the
  # GCP-only consolidation. Re-introduce only if AWS/Azure deploys come
  # back as supported targets.

  auth-guardrails:
    name: Authentication guardrails check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate non-dev auth invariants
        run: ./scripts/check-auth-guardrails.sh

  hipaa-day1-controls:
    name: HIPAA day-1 baseline check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HIPAA day-1 control baseline
        run: ./scripts/check-hipaa-day1-controls.sh

  runbook-readiness:
    name: Runbook readiness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate unified runbook and sign-off artifacts
        run: ./scripts/check-runbook-readiness.sh

  terraform-security-baseline:
    name: Terraform security baseline check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate terraform security baseline signals
        run: ./scripts/check-terraform-security-baseline.sh

  python-test:
    name: "Python tests (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [defacing, dicom-tools, dimse-receiver, midi-b, analytics-service, sct-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: cd ${{ matrix.service }} && pip install -r requirements.txt -r requirements-test.txt
      - name: Run tests
        run: cd ${{ matrix.service }} && pytest -v --tb=short

  frontend:
    name: "TypeScript check (${{ matrix.app.name }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - { dir: client, name: "@aegis/client", needs_client: false }
          - { dir: frontend/upload-portal, name: upload-portal, needs_client: true }
          - { dir: frontend/admin-dashboard, name: admin-dashboard, needs_client: true }
          - { dir: frontend/export-portal, name: export-portal, needs_client: false }
          - { dir: frontend/landing, name: landing, needs_client: false }
          - { dir: mcp-server, name: mcp-server, needs_client: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build @aegis/client (dependency)
        if: matrix.app.needs_client
        run: cd client && npm install && npm run build
      - name: Install dependencies
        run: cd ${{ matrix.app.dir }} && npm install
      - name: Type check
        run: cd ${{ matrix.app.dir }} && npx tsc --noEmit

  mcp-test:
    name: MCP server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd mcp-server && npm install
      - name: Run tests
        run: cd mcp-server && npm test

  docker:
    name: "Docker build (${{ matrix.service.name }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { context: api, name: api }
          # admin-dashboard uses @aegis/client (workspace dep) so it builds from repo root
          - { context: ".", dockerfile: frontend/admin-dashboard/Dockerfile, name: admin-dashboard }
          - { context: defacing, name: defacing }
          - { context: dicom-tools, name: dicom-tools }
          - { context: dimse-receiver, name: dimse-receiver }
          - { context: analytics-service, name: analytics-service }
          - { context: sct-service, name: sct-service }
          - { context: mcp-server, name: mcp-server }
          - { context: dwv, name: dwv }
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (retry on transient registry errors)
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          BUILD_CONTEXT: ${{ matrix.service.context }}
          BUILD_DOCKERFILE: ${{ matrix.service.dockerfile }}
        shell: bash
        run: |
          set -euo pipefail
          image="aegis-${SERVICE_NAME}:ci"
          attempts=5
          delay_seconds=10

          for attempt in $(seq 1 "${attempts}"); do
            echo "Docker build attempt ${attempt}/${attempts}: ${image} from ${BUILD_CONTEXT}"
            if [ -n "${BUILD_DOCKERFILE}" ]; then
              build_cmd=(docker build -f "${BUILD_DOCKERFILE}" -t "${image}" "${BUILD_CONTEXT}")
            else
              build_cmd=(docker build -t "${image}" "${BUILD_CONTEXT}")
            fi
            if "${build_cmd[@]}"; then
              exit 0
            fi

            if [ "${attempt}" -eq "${attempts}" ]; then
              break
            fi

            echo "Build failed; sleeping ${delay_seconds}s before retry..."
            sleep "${delay_seconds}"
            delay_seconds=$((delay_seconds * 2))
          done

          echo "Docker build failed after ${attempts} attempts."
          exit 1
