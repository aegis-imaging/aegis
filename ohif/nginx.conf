server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript;

    # Health check for Cloud Run liveness probe
    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # Allow OHIF to be embedded in iframes from the admin dashboard and landing page.
    # Without this, browsers block cross-origin iframe embedding by default.
    # Localhost origins are included for local Docker Compose development.
    add_header Content-Security-Policy "frame-ancestors https://admin.aegisimaging.ai https://aegisimaging.ai https://www.aegisimaging.ai http://localhost:3001 http://localhost:3000 'self'" always;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
