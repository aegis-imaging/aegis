server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Proxy /agent/* requests to the MCP agent server on Cloud Run.
  # No trailing slash on proxy_pass so nginx preserves the full path
  # (/agent/ask reaches the MCP server as /agent/ask, not /ask).
  location /agent/ {
    proxy_pass        https://aegis-mcp-server-202618461222.us-central1.run.app;
    proxy_set_header  Host aegis-mcp-server-202618461222.us-central1.run.app;
    proxy_ssl_server_name on;
    proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Proxy all /api/* requests to the API backend.
  # IAP has already authenticated the user before this request reaches nginx,
  # so X-Goog-Authenticated-User-Email is set and forwarded to the API.
  location /api/ {
    proxy_pass https://api.aegisimaging.ai/api/;
    proxy_set_header Host api.aegisimaging.ai;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Forward IAP identity headers so the Go API auth middleware can authenticate.
    proxy_set_header X-Goog-Authenticated-User-Email $http_x_goog_authenticated_user_email;
    proxy_set_header X-Goog-IAP-JWT-Assertion $http_x_goog_iap_jwt_assertion;
  }

  # Never cache index.html — ensures browsers always get the latest JS/CSS bundle.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
