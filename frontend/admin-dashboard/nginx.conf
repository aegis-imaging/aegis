server {
  listen 8080;
  server_name _;

  # DNS resolver directive for variable-based proxy_pass (required by nginx when
  # proxy_pass uses a variable). Injected via NGINX_RESOLVER_DIRECTIVE env var.
  # On GCP Cloud Run: set to "resolver 169.254.169.254 valid=30s;" (GCP metadata DNS).
  # On AWS ECS: set to "resolver 169.254.169.253 valid=10s;" (ECS/Route53 resolver).
  # On Azure: set to "resolver 168.63.129.16 valid=30s;" (Azure DNS).
  # Without this, nginx cannot resolve hostnames in variable proxy_pass at request time.
  ${NGINX_RESOLVER_DIRECTIVE}

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Proxy /agent/* requests to the MCP agent server.
  # MCP_SERVER_URL is injected at container startup via envsubst (see Dockerfile CMD).
  # On GCP Cloud Run: defaults to https://aegis-mcp-server-uk5cvzf5nq-uc.a.run.app
  # On AWS ECS:       set to http://mcp-server.aegis.local:8080 via ECS task env var
  # Using a variable for proxy_pass forces nginx to re-resolve the hostname on each
  # request (honoring the resolver TTL), preventing stale DNS after task replacements.
  location /agent/ {
    set $mcp_upstream ${MCP_SERVER_URL};
    proxy_pass        $mcp_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header  Connection "";
    proxy_set_header  Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Proxy all /api/* requests to the API backend.
  # API_URL is injected at container startup via envsubst (see Dockerfile CMD).
  # On GCP Cloud Run: defaults to https://api.aegisimaging.ai
  # On AWS ECS: set to http://api.aegis.local:8080 via ECS task env var
  # The cloud auth header that is present (IAP or Cognito JWT) is forwarded to
  # the Go API so its auth middleware can authenticate the request.
  # Using a variable for proxy_pass forces nginx to re-resolve the hostname on each
  # request (honoring the resolver TTL), preventing stale DNS after task replacements.
  location /api/ {
    set $api_upstream ${API_URL};
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host                             $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For                 $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto               $scheme;
    # AWS ALB + Cognito: JWT injected by ALB authenticate-cognito action.
    proxy_set_header X-Amzn-Oidc-Data               $http_x_amzn_oidc_data;
    # Azure Easy Auth: user identity headers injected by Container Apps auth.
    proxy_set_header X-MS-CLIENT-PRINCIPAL-NAME     $http_x_ms_client_principal_name;
    proxy_set_header X-MS-CLIENT-PRINCIPAL-ID       $http_x_ms_client_principal_id;
    proxy_set_header X-MS-CLIENT-PRINCIPAL          $http_x_ms_client_principal;
    # GCP IAP: identity headers injected by Cloud IAP.
    proxy_set_header X-Goog-Authenticated-User-Email $http_x_goog_authenticated_user_email;
    proxy_set_header X-Goog-IAP-JWT-Assertion        $http_x_goog_iap_jwt_assertion;
  }

  # Never cache index.html — ensures browsers always get the latest JS/CSS bundle.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
