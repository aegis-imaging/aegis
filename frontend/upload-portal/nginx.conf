server {
  listen 8080;
  server_name _;

  # DNS resolver directive for variable-based proxy_pass (required by nginx when
  # proxy_pass uses a variable). Injected via NGINX_RESOLVER_DIRECTIVE env var.
  # On GCP Cloud Run: set to "resolver 169.254.169.254 valid=30s;"
  # On AWS ECS:       set to "resolver 169.254.169.253 valid=10s;"
  # On Azure:         set to "resolver 168.63.129.16 valid=30s;"
  ${NGINX_RESOLVER_DIRECTIVE}

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Proxy all /api/* requests to the API backend.
  # API_URL is injected at container startup via envsubst (see Dockerfile CMD).
  location /api/ {
    set $api_upstream ${API_URL};
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host                             $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For                 $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto               $scheme;
  }

  # Never cache index.html — ensures browsers always get the latest JS/CSS bundle.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
