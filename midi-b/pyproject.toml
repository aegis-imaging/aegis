[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-b"
version = "0.1.0"
description = "MIDI-B: Medical Image De-Identification Benchmark CLI"
requires-python = ">=3.10"
dependencies = [
    "pydicom>=2.4.0",
    "numpy>=1.24.0",
    "click>=8.0",
]

[project.optional-dependencies]
pixel = ["Pillow>=10.0"]

[project.scripts]
midi-b = "midi_b.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
