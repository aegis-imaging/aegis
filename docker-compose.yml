version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports:
      - "5432:5432"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  ohif:
    image: ohif/app:v3-stable
    ports:
      - "3002:80"
    volumes:
      - ./ohif-config.js:/usr/share/nginx/html/app-config.js:ro
