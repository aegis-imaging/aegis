services:
  # ── Infrastructure ──────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  ohif:
    image: ohif/app:v3-stable
    ports:
      - "3002:80"
    volumes:
      - ./ohif-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      api:
        condition: service_healthy

  # ── Go API ──────────────────────────────────────────────────────────

  api:
    build:
      context: ./api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://aegis:aegis@postgres:5432/aegis?sslmode=disable"
      STORAGE_MODE: "local"
      LOCAL_STORAGE_DIR: "/app/data"
      API_BASE_URL: "http://localhost:8080"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      DEFACING_SERVICE_URL: "http://defacing:8080"
      PHI_DETECTION_SERVICE_URL: "http://phi-detection:8080"
      QC_SERVICE_URL: "http://qc-service:8080"
      BIDS_SERVICE_URL: "http://bids-service:8080"
      CLASSIFICATION_SERVICE_URL: "http://classification-service:8080"
      PROTOCOL_SERVICE_URL: "http://protocol-service:8080"
    volumes:
      - aegis-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["/aegis-api", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Python sidecar services ─────────────────────────────────────────

  defacing:
    build:
      context: ./defacing
      args:
        INCLUDE_DEEPDEFACER: "true"
    volumes:
      - aegis-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  phi-detection:
    build:
      context: ./phi-detection
    volumes:
      - aegis-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  qc-service:
    build:
      context: ./qc-service
    volumes:
      - aegis-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  bids-service:
    build:
      context: ./bids-service
    volumes:
      - aegis-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  classification-service:
    build:
      context: ./classification-service
    volumes:
      - aegis-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  protocol-service:
    build:
      context: ./protocol-service
    volumes:
      - aegis-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  aegis-data:
